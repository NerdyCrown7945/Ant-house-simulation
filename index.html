<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ant Colony Side-View Simulation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <aside class="panel">
        <h1>개미굴 단면 시뮬레이션</h1>
        <p>어항처럼 옆에서 보는 단면 뷰 + 넓은 지하 월드 + 캐스트별 자동 행동</p>

        <section class="group">
          <h2>스폰</h2>
          <label>개체 종류
            <select id="antType">
              <option value="worker">일개미</option>
              <option value="soldier">병정개미</option>
              <option value="male">수개미</option>
              <option value="queen">여왕개미</option>
            </select>
          </label>
          <label>수량
            <input id="spawnQty" type="number" min="1" max="200" value="20" />
          </label>
          <button id="spawnBtn">추가</button>
        </section>

        <section class="group">
          <h2>월드/도구</h2>
          <label>가로 카메라
            <input id="cameraSlider" type="range" min="0" max="1" value="0" />
          </label>
          <label>시뮬레이션 속도
            <input id="speedSlider" type="range" min="1" max="6" value="2" />
          </label>
          <div class="tool-row">
            <button id="eraserBtn">지우개</button>
            <button id="voidBtn">보이드</button>
          </div>
          <div class="tool-row">
            <button id="clearBtn" class="danger">월드 초기화</button>
            <button id="pauseBtn">일시정지</button>
          </div>
          <small>캔버스 클릭/드래그로 지형 수정</small>
        </section>

        <section class="group">
          <h2>콜로니 지표</h2>
          <ul id="metrics" class="metrics"></ul>
        </section>
      </aside>

      <section class="viewport">
        <canvas id="simCanvas" width="1200" height="680"></canvas>
      </section>
    </main>

    <script src="simulation.js"></script>
  </body>
</html>
